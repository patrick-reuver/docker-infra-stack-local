name: infra-clickhouse

services:
  clickhouse:
    build:
      context: ../..
      dockerfile: service_stack_application/clickhouse/Dockerfile
      args:
        CLICKHOUSE_BASE_IMAGE: clickhouse/clickhouse-server:24.8
    image: infra-clickhouse:local
    container_name: infra-clickhouse
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/usr/local/bin/infisical-runtime-env.sh", "--path=${INFISICAL_SECRET_PATH:-/clickhouse}", "--", "/entrypoint.sh"]
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_USER=langfuse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - infra_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.clickhouse.rule=Host(`clickhouse.localhost`)
      - traefik.http.routers.clickhouse.entrypoints=web
      - traefik.http.services.clickhouse.loadbalancer.server.port=8123
      - traefik.docker.network=infra_net

volumes:
  clickhouse_data:

networks:
  infra_net:
    external: true
