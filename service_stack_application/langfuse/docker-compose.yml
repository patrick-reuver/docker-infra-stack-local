name: infra-langfuse

services:
  langfuse-web:
    build:
      context: ../..
      dockerfile: service_stack_application/langfuse/Dockerfile
      args:
        LANGFUSE_BASE_IMAGE: langfuse/langfuse:latest
    image: infra-langfuse:local
    container_name: infra-langfuse-web
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/usr/local/bin/infisical-runtime-env.sh", "--path=${INFISICAL_SECRET_PATH:-/langfuse}", "--"]
    command:
      - dumb-init
      - --
      - ./web/entrypoint.sh
      - /bin/sh
      - -c
      - |
        if [ -n "$$NEXT_PUBLIC_LANGFUSE_CLOUD_REGION" ]; then
          node --import dd-trace/initialize.mjs ./web/server.js --keepAliveTimeout 110000;
        else
          node ./web/server.js --keepAliveTimeout 110000;
        fi
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXTAUTH_URL=http://langfuse.localhost
      - DATABASE_HOST=postgres
      - DATABASE_NAME=langfuse_db
      - DATABASE_ARGS=schema=public
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
    networks:
      - infra_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://$(hostname):3000/api/public/health\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.langfuse.rule=Host(`langfuse.localhost`)
      - traefik.http.routers.langfuse.entrypoints=web
      - traefik.http.routers.langfuse.service=langfuse
      - traefik.http.services.langfuse.loadbalancer.server.port=3000
      - traefik.docker.network=infra_net

networks:
  infra_net:
    external: true
