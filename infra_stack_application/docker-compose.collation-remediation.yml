name: infra-stack-collation-remediation

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: infra-postgres-collation-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_admin}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB:-postgres}
    ports:
      - "${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - ${PGDATA_CLONE_PATH:?set PGDATA_CLONE_PATH to an isolated PGDATA copy}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DEFAULT_DB:-postgres}"]
      interval: 15s
      timeout: 5s
      retries: 10
